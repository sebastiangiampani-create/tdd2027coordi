name: TDD 2027 - Informes HTML por correo (CCO)
on:
  schedule:
    - cron: '45 22 * * 1-5'  # 19:45 Argentina: intento principal
    - cron: '57 22 * * 1-5'  # 19:57 Argentina: primer respaldo sin duplicados
    - cron: '13 23 * * 1-5'  # 20:13 Argentina: segundo respaldo sin duplicados
    - cron: '31 23 * * 1-5'  # 20:31 Argentina: tercer respaldo sin duplicados
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha AAAA-MM-DD; vacio = hoy Argentina'
        required: false
        type: string
      alcance:
        description: 'Turno del informe'
        required: true
        default: general
        type: choice
        options:
          - tm
          - tm_tt
          - general
      modo:
        description: 'Validar sin enviar o enviar email'
        required: true
        default: validar
        type: choice
        options:
          - validar
          - enviar
permissions:
  contents: read
  actions: read
concurrency:
  group: tdd-2027-one-mail-${{ github.ref }}
  cancel-in-progress: false
jobs:
  informe-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Controlar ventana nocturna en Argentina
        id: ventana
        env:
          ES_PROGRAMADO: ${{ github.event_name == 'schedule' }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          ahora = datetime.now(ZoneInfo("America/Argentina/Buenos_Aires"))
          horario = time(19, 45) <= ahora.time().replace(tzinfo=None) <= time(21, 30)
          permitido = os.environ.get("ES_PROGRAMADO") != "true" or (ahora.weekday() < 5 and horario)
          print(f"CONTROL_HORARIO: {ahora:%Y-%m-%d %H:%M} Argentina; envio_permitido={str(permitido).lower()}")
          if not permitido:
              print("ENVIO_FUERA_DE_VENTANA: no se ejecutara SMTP en este intento tardio.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("permitido=" + ("true" if permitido else "false") + "\n")
          PY
      - name: Verificar scripts
        run: python3 -m py_compile scripts/tdd_whatsapp_report.py scripts/tdd_report_email_brief.py scripts/tdd_report_email.py scripts/tdd_alert_failed_email.py scripts/tdd_email_dedupe.py
      - name: Instalar dependencias
        run: python3 -m pip install --disable-pip-version-check openpyxl msoffcrypto-tool cairosvg reportlab
      - name: Verificar fechas y columnas antes del envio
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from tdd_report_email import day, validate_attendance_sheet
          from datetime import date
          assert day("16/11/2026") == date(2026,11,16)
          assert day("16/11") == date(2026,11,16)
          assert day("Date(2026,10,16)") == date(2026,11,16)
          assert day("16/11/2026 10:30") == date(2026,11,16)
          assert day("Enc. 1") is None
          assert day("#N/A") is None
          header = [""]*16
          header[14], header[15] = "Fecha", "Turno"
          assert validate_attendance_sheet([header,["DNI","123"]+[""]*12+["16/11/2026","Mañana"]]) == 1
          print("OK: formato de fecha y esquema de columnas O/P")
          PY
      - name: Generar informe de texto auxiliar
        env:
          REPORT_DRY_RUN: "1"
          REPORT_DATE: ${{ inputs.fecha }}
          REPORT_SCOPE: ${{ github.event_name == 'schedule' && 'general' || inputs.alcance }}
        continue-on-error: true
        run: python3 scripts/tdd_whatsapp_report.py
      - name: Comprobar si el informe ya fue enviado
        id: duplicate
        if: ${{ steps.ventana.outputs.permitido == 'true' && (github.event_name == 'schedule' || inputs.modo == 'enviar') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ inputs.fecha }}
        run: python3 scripts/tdd_email_dedupe.py
      - name: Enviar informe por correo en CCO
        if: ${{ steps.ventana.outputs.permitido == 'true' && (github.event_name == 'schedule' || inputs.modo == 'enviar') && steps.duplicate.outputs.send == 'true' }}
        env:
          TDD_EXCEL_PASSWORD: ${{ secrets.TDD_EXCEL_PASSWORD }}
          TDD_GMAIL_APP_PASSWORD: ${{ secrets.TDD_GMAIL_APP_PASSWORD }}
          REPORT_DATE: ${{ inputs.fecha }}
        run: python3 scripts/tdd_report_email.py
      - name: Guardar informe de validacion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'validar' }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-email-tdd
          path: report-output/mensaje.txt
          retention-days: 7
      - name: Avisar si falla el envio
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.modo == 'enviar') }}
        env:
          TDD_GMAIL_APP_PASSWORD: ${{ secrets.TDD_GMAIL_APP_PASSWORD }}
        run: python3 scripts/tdd_alert_failed_email.py
