name: TDD 2027 - Informe de asistencia
on:
  schedule:
    - cron: "15 23 * * 1-5" # 20:15 Argentina (UTC-3), lunes a viernes
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del reporte AAAA-MM-DD (vacio = hoy en Buenos Aires)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tdd-attendance-email
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas para Excel cifrado
        run: python3 -m pip install --disable-pip-version-check openpyxl msoffcrypto-tool cairosvg reportlab
      - name: Enviar informe si hay asistencia de la jornada
        env:
          TDD_GMAIL_APP_PASSWORD: ${{ secrets.TDD_GMAIL_APP_PASSWORD }}
          TDD_EXCEL_PASSWORD: ${{ secrets.TDD_EXCEL_PASSWORD }}
          REPORT_DATE: ${{ inputs.fecha }}
        run: python3 scripts/tdd_report_email.py
