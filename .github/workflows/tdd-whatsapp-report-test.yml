name: TDD 2027 - Piloto WhatsApp solo destinatario de prueba
on:
  schedule:
    # Argentina UTC-3, lunes a viernes. GitHub puede iniciar con demora.
    - cron: '0 15 * * 1-5'   # 12:00 AR - manana
    - cron: '0 20 * * 1-5'   # 17:00 AR - tarde
    - cron: '45 22 * * 1-5'  # 19:45 AR - vespertino
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del informe AAAA-MM-DD (vacio = hoy en Buenos Aires)"
        required: false
        type: string
      modo:
        description: "Validar mensaje sin enviar o enviar por WhatsApp"
        required: true
        default: validar
        type: choice
        options:
          - validar
          - enviar
      alcance:
        description: "Corte acumulativo: tm (12:00), tm_tt (17:00), general (19:45)"
        required: true
        default: general
        type: choice
        options:
          - tm
          - tm_tt
          - general
permissions:
  contents: read
jobs:
  informe-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis Python antes del envio
        run: python3 -m py_compile scripts/tdd_whatsapp_report.py scripts/tdd_report_email.py
      - name: Instalar dependencias de lectura de asistencia
        run: python3 -m pip install --disable-pip-version-check openpyxl msoffcrypto-tool cairosvg reportlab
      - name: Generar informe y opcionalmente enviar a destinatario de prueba
        env:
          TDD_WA_ACCESS_TOKEN: ${{ secrets.TDD_WA_ACCESS_TOKEN }}
          TDD_WA_PHONE_NUMBER_ID: ${{ secrets.TDD_WA_PHONE_NUMBER_ID }}
          TDD_WA_TEST_RECIPIENT: ${{ secrets.TDD_WA_TEST_RECIPIENT }}
          REPORT_TEST_ONLY: "1"
          REPORT_DATE: ${{ inputs.fecha }}
          REPORT_SCOPE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 15 * * 1-5' && 'tm' || github.event.schedule == '0 20 * * 1-5' && 'tm_tt' || 'general') || inputs.alcance }}
          REPORT_DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (inputs.modo == 'validar' && '1' || '0') }}
        run: python3 scripts/tdd_whatsapp_report.py
      - name: Guardar mensaje de texto para revisar
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'validar' }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-tdd-${{ inputs.alcance }}-${{ inputs.fecha || 'hoy' }}
          path: report-output/
          if-no-files-found: error
          retention-days: 7
