name: TDD 2027 - Informe PDF por WhatsApp (prueba manual)
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del informe AAAA-MM-DD (vacio = hoy en Buenos Aires)"
        required: false
        type: string
      alcance:
        description: "Corte acumulativo: tm (12:00), tm_tt (17:00), general (20:15)"
        required: true
        default: general
        type: choice
        options:
          - tm
          - tm_tt
          - general
permissions:
  contents: read
jobs:
  prueba-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias del PDF visual
        run: python3 -m pip install --disable-pip-version-check openpyxl msoffcrypto-tool cairosvg reportlab
      - name: Enviar PDF solo a destinatario de prueba
        env:
          TDD_WA_ACCESS_TOKEN: ${{ secrets.TDD_WA_ACCESS_TOKEN }}
          TDD_WA_PHONE_NUMBER_ID: ${{ secrets.TDD_WA_PHONE_NUMBER_ID }}
          TDD_WA_TEST_RECIPIENT: ${{ secrets.TDD_WA_TEST_RECIPIENT }}
          REPORT_DATE: ${{ inputs.fecha }}
          REPORT_SCOPE: ${{ inputs.alcance }}
        run: python3 scripts/tdd_whatsapp_report.py
