<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12395c"><title>Áreas y estadísticas · TDD 2027</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f7fa;color:#12395c}*{box-sizing:border-box}body{margin:0}.brand{background:white;display:flex;justify-content:center;padding:15px}.brand svg{width:min(320px,85vw);height:auto}header{background:#12395c;color:white;padding:27px 20px}header .wrap{max-width:1060px;margin:auto}header p{color:#d7e6ef}h1{margin:5px 0}.wrap{max-width:1060px;margin:auto;padding:0 17px}.panel{background:white;border:1px solid #d8e4ec;border-radius:17px;padding:18px;margin:17px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.tile{background:#f4f8fb;border:1px solid #d6e2e9;border-radius:13px;padding:15px;text-align:left;font:inherit;color:inherit;cursor:pointer;overflow-wrap:anywhere}.tile strong{display:block;font-size:16px}.tile small{display:block;color:#5b7180;margin-top:8px}.tile.active{border:2px solid #087f78;background:#e5f6f3}.row{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #c7d9e4;background:white;color:#12395c;border-radius:999px;padding:11px 14px;font:inherit;cursor:pointer}.pill.active{background:#12395c;color:white}.item{padding:13px 0;border-bottom:1px solid #e2eaf0}.item:last-child{border:0}.item strong{display:block}.item small{display:block;color:#597184;margin-top:6px}.count{font-size:13px;color:#5b7180}input{width:100%;padding:14px;font:inherit;border:1px solid #b9cbd8;border-radius:11px}.back{color:#126e65;text-decoration:none;font-weight:700}.hidden{display:none!important}#status{font-size:12px;color:#597184;margin:20px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#e8f1f7;padding:13px;border-radius:12px}.metric strong{font-size:24px;display:block}.metric small{color:#526a7b}h2{font-size:19px;margin:0 0 13px}footer{text-align:center;padding:28px;color:#647a89}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(3,1fr)}.tile{padding:12px}}

html{background:#f4f7fa}body{background:#f4f7fa!important;min-height:100vh;display:flex;flex-direction:column;font-family:Archivo,system-ui,sans-serif!important}main{flex:1 0 auto}body>.brand,header .brand{display:none!important}body>header:not(.em-site-top){background:#edf3f8!important;color:#12395c!important;border-bottom:1px solid #d8e1e8;padding-top:25px;padding-bottom:30px}body>header:not(.em-site-top) h1{color:#12395c!important;font-weight:900;letter-spacing:-.035em}body>header:not(.em-site-top) p{color:#526b80!important}body>header:not(.em-site-top) a{color:#175a82!important}body>header:not(.em-site-top) .tag,body>header:not(.em-site-top) .eyebrow{color:#2c5da6!important}body>header:not(.em-site-top) .edition{color:#12395c!important;border-color:#aabdc9!important}body>header:not(.em-site-top) .lead{color:#526b80!important}.em-site-top{flex-shrink:0}.em-site-footer{flex-shrink:0}body>.foot,body>footer:not(.em-site-footer),main>footer:not(.em-site-footer){display:none!important}body .panel,body .step,body .search-panel,body .subject-panel{background:#fff;border-color:#d8e1e8;box-shadow:0 9px 28px rgba(18,57,92,.06)}body .card,body .tile{background:#fff;border:1px solid #d8e1e8;box-shadow:0 5px 18px rgba(18,57,92,.05);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}body .card:hover,body .tile:hover{border-color:#8aafc6;box-shadow:0 9px 24px rgba(18,57,92,.12);transform:translateY(-2px)}body .tile.active,body .card.active{background:#e7f8f5;border-color:#168d83}body button,body select,body input{font-family:Archivo,system-ui,sans-serif}body button:focus-visible,body a:focus-visible{outline:3px solid #2c5da6;outline-offset:3px}.em-site-top{box-shadow:0 2px 12px rgba(18,57,92,.045)}

</style></head><body><div class="em-site-top"><a href="portal.html" aria-label="Ir al Portal TDD 2027"><img src="assets/em-logo-header.svg" alt="Escuela de Maestros"></a><span class="em-edition">TDD 2027</span></div><nav class="em-backbar" aria-label="Volver al portal"><a class="em-backlink" href="portal.html">← Volver al portal</a></nav><header><div class="wrap"><a href="portal.html" style="color:#aee5da;text-decoration:none">← Volver al portal</a><h1>Áreas y estadísticas</h1><p>Distribución de comisiones por área, sede, turno y día.</p></div></header><main class="wrap"><section class="panel"><div class="metrics" id="metrics"></div><h2 style="margin-top:20px">1. Explorá por</h2><div class="row" id="tabs"></div><div id="results"></div></section><p id="status" role="status">Cargando información…</p></main><footer>Escuela de Maestros · TDD 2027</footer><script>'use strict';const SHEET='1x-cRhsulmABI8wyB87xKeZw4Kq1GIMb4XCEzfaYozww',CACHE='tdd2027-bedeles-cache-v1',keys=['commission','schools','area','shift','day','hours','venue'];function isDataRow(r){const n=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const c=n(r.commission),a=n(r.area),t=n(r.shift),d=n(r.day),h=n(r.hours),v=n(r.venue);if(!c||['comision','comisiones','nro comision','numero de comision','n° comision'].includes(c))return false;if(['area','areas','area curricular'].includes(a)||['turno','turnos'].includes(t)||['dia','dias'].includes(d)||['horario','horarios'].includes(h)||['sede','sedes'].includes(v))return false;return true}

const $=id=>document.getElementById(id),clean=v=>String(v??'').replace(/\s+/g,' ').trim(),norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),weekdays=['lunes','martes','miercoles','jueves','viernes'];let rows=[],busy=false,last=0;

function unique(v){return [...new Set(v.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}))}
function restore(){try{const o=JSON.parse(localStorage.getItem(CACHE)||'null');if(o?.rows?.length){rows=o.rows.filter(isDataRow);last=o.date||0;return true}}catch(e){}return false}
function save(){try{localStorage.setItem(CACHE,JSON.stringify({rows,date:Date.now()}))}catch(e){}}
function jsonp(offset){return new Promise((resolve,reject)=>{const name='__tddbed_'+offset+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let ended=false;const finish=(error,data)=>{if(ended)return;ended=true;clearTimeout(timer);delete window[name];script.remove();error?reject(error):resolve(data)};window[name]=data=>data.status==='error'?finish(Error('Google Sheets rechazó la consulta')):finish(null,data.table);const q=encodeURIComponent('select A,B,C,D,E,F,G limit 400 offset '+offset);script.src='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tq='+q+'&tqx='+encodeURIComponent('responseHandler:'+name);script.onerror=()=>finish(Error('No se pudo conectar'));const timer=setTimeout(()=>finish(Error('La consulta tardó demasiado')),12000);document.head.append(script)})}
async function refresh(){if(busy)return;busy=true;$('status').textContent='Sincronizando automáticamente…';try{const all=[];for(let i=0;i<100;i++){const t=await jsonp(i*400);const batch=(t.rows||[]).map(r=>{const o={};keys.forEach((k,j)=>o[k]=clean(r.c?.[j]?.f??r.c?.[j]?.v));return o}).filter(isDataRow);all.push(...batch);if((t.rows||[]).length<400)break}if(!all.length)throw Error('La planilla no devolvió datos');rows=all;last=Date.now();save();render();$('status').textContent='Agenda actualizada · '+rows.length+' registros'}catch(e){$('status').textContent=(rows.length?'Se mantienen los datos guardados. ':'')+e.message}finally{busy=false}}

let field='',selected='';const fields=[['area','Áreas'],['venue','Sedes'],['shift','Turnos'],['day','Días']];const keyOf=r=>[r.commission,r.area,r.shift,r.day,r.venue].join('|');function tile(title,subtitle,fn,active=false){const b=document.createElement('button');b.type='button';b.className='tile'+(active?' active':'');const h=document.createElement('strong');h.textContent=title;const s=document.createElement('small');s.textContent=subtitle;b.append(h,s);b.onclick=fn;return b}function heading(el,title){const h=document.createElement('h2');h.textContent=title;el.append(h)}function render(){const tabs=$('tabs'),out=$('results'),metrics=$('metrics');tabs.replaceChildren();out.replaceChildren();metrics.replaceChildren();for(const [n,label] of [[new Set(rows.map(r=>r.commission)).size,'Comisiones únicas'],[new Set(rows.map(r=>r.venue)).size,'Sedes'],[new Set(rows.map(r=>r.area)).size,'Áreas']]){const d=document.createElement('div');d.className='metric';const a=document.createElement('strong');a.textContent=n;const b=document.createElement('small');b.textContent=label;d.append(a,b);metrics.append(d)}for(const [key,name] of fields){tabs.append(tile(name,'Explorar distribución',()=>{field=key;selected='';render()},field===key))}if(!field)return;const grouped=new Map();for(const r of rows){const k=r[field]||'Sin informar';if(!grouped.has(k))grouped.set(k,new Set());grouped.get(k).add(keyOf(r))}heading(out,'2. Elegí '+({area:'un área',venue:'una sede',shift:'un turno',day:'un día'}[field]));const grid=document.createElement('div');grid.className='grid';for(const [name,items] of [...grouped].sort((a,b)=>b[1].size-a[1].size)){grid.append(tile(name,items.size+' asignaciones de comisión',()=>{selected=name;render()},selected===name))}out.append(grid);if(!selected)return;const panel=document.createElement('section');panel.className='panel';heading(panel,'3. Detalle · '+selected);const filtered=rows.filter(r=>(r[field]||'Sin informar')===selected),uniqueCommissions=new Set(filtered.map(r=>r.commission));const summary=document.createElement('p');summary.className='count';summary.textContent=uniqueCommissions.size+' comisiones únicas · '+new Set(filtered.map(keyOf)).size+' asignaciones';panel.append(summary);const seen=new Set();for(const r of filtered){const k=keyOf(r);if(seen.has(k))continue;seen.add(k);const item=document.createElement('div');item.className='item';const title=document.createElement('strong');title.textContent='Comisión '+r.commission+' · '+r.area;const sub=document.createElement('small');sub.textContent=[r.day,r.shift,r.hours,r.venue].filter(Boolean).join(' · ');item.append(title,sub);panel.append(item)}out.append(panel)}};const cached=restore();if(cached){render();$('status').textContent='Datos guardados disponibles'}else render();if(navigator.onLine)refresh();else if(!cached)$('status').textContent='Se necesita internet para la primera carga';window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine&&Date.now()-last>60000)refresh()});</script><footer class="em-site-footer" aria-label="Identidad institucional"><img class="em-logo" src="assets/em-logo-footer.svg" alt="Escuela de Maestros"><img class="em-ministerio" src="assets/ministerio-footer.svg" alt="Ministerio de Educación · Buenos Aires Ciudad"></footer></body></html>
