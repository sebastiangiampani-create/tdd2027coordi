function jsonp(offset){return new Promise((resolve,reject)=>{const name='__tddbed_'+offset+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let ended=false;const finish=(error,data)=>{if(ended)return;ended=true;clearTimeout(timer);delete window[name];script.remove();error?reject(error):resolve(data)};window[name]=data=>data.status==='error'?finish(Error('Google Sheets rechazó la consulta')):finish(null,data.table);const q=encodeURIComponent('select A,B,C,D,E,F,G limit 400 offset '+offset);script.src='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tq='+q+'&tqx='+encodeURIComponent('responseHandler:'+name);script.onerror=()=>finish(Error('No se pudo conectar'));const timer=setTimeout(()=>finish(Error('La consulta tardó demasiado')),12000);document.head.append(script)})}
async function refresh(){if(busy)return;busy=true;$('status').textContent='Sincronizando automáticamente…';try{const all=[];for(let i=0;i<100;i++){const t=await jsonp(i*400);const batch=(t.rows||[]).map(r=>{const o={};keys.forEach((k,j)=>o[k]=clean(r.c?.[j]?.f??r.c?.[j]?.v));return o}).filter(isDataRow);all.push(...batch);if((t.rows||[]).length<400)break}if(!all.length)throw Error('La planilla no devolvió datos');rows=all;last=Date.now();save();render();$('status').textContent='Agenda actualizada · '+rows.length+' registros'}catch(e){$('status').textContent=(rows.length?'Se mantienen los datos guardados. ':'')+e.message}finally{busy=false}}

let field='area';const fields=[['area','Áreas'],['venue','Sedes'],['shift','Turnos'],['day','Días']];function render(){const nav=$('tabs');nav.replaceChildren();for(const [key,name] of fields){const b=document.createElement('button');b.className='pill'+(field===key?' active':'');b.textContent=name;b.onclick=()=>{field=key;render()};nav.append(b)}const metrics=$('metrics');metrics.replaceChildren();for(const [n,label] of [[rows.length,'Registros'],[new Set(rows.map(r=>r.commission)).size,'Comisiones únicas'],[new Set(rows.map(r=>r.venue)).size,'Sedes']]){const d=document.createElement('div');d.className='metric';const a=document.createElement('strong');a.textContent=n;const b=document.createElement('small');b.textContent=label;d.append(a,b);metrics.append(d)}const groups=new Map();for(const r of rows){const key=r[field]||'Sin informar';if(!groups.has(key))groups.set(key,new Set());groups.get(key).add(r.commission+'|'+r.day+'|'+r.shift+'|'+r.venue)}const ordered=[...groups].sort((a,b)=>b[1].size-a[1].size),max=ordered[0]?.[1].size||1,out=$('results');out.replaceChildren();for(const [key,items] of ordered){const e=document.createElement('div');e.className='item';const a=document.createElement('strong');a.textContent=key+' · '+items.size+' comisiones';const bar=document.createElement('div');bar.style.cssText='height:12px;background:#e4edf2;border-radius:9px;margin-top:9px;overflow:hidden';const fill=document.createElement('div');fill.style.cssText='height:100%;background:#087f78;border-radius:9px;width:'+Math.round(items.size/max*100)+'%';bar.append(fill);e.append(a,bar);out.append(e)}}const cached=restore();if(cached){render();$('status').textContent='Datos guardados disponibles'}else render();if(navigator.onLine)refresh();else if(!cached)$('status').textContent='Se necesita internet para la primera carga';window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine&&Date.now()-last>60000)refresh()});</script></body></html>
