<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informes de asistencia | TDD 2027</title><style>body{font:15px system-ui;margin:0;background:#f3f6fa;color:#12395c}header{padding:18px 5%;background:white;border-bottom:1px solid #dce5ed}header img{max-width:250px}main{max-width:1250px;margin:auto;padding:25px 18px}.panel{background:white;border:1px solid #dce5ed;border-radius:13px;padding:18px;margin:16px 0}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b7c8d5;border-radius:7px;background:white}button{background:#12395c;color:white;border:0;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer;margin:5px 6px 5px 0}button:disabled{opacity:.5}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e0e8ed;text-align:left}th{position:sticky;top:0;background:#eaf1f7}@media(max-width:800px){.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.filters{grid-template-columns:1fr}}@media print{header,.filters,.actions,.note{display:none}body{background:white;color:black}main{padding:0;max-width:none}.panel{border:0;padding:0}.scroll{overflow:visible;max-height:none}table{white-space:normal;font-size:9px}th{position:static}@page{size:landscape}}</style></head><body><header><img src="assets/em-logo-header.svg" alt="Escuela de Maestros"></header><main><h1>Informes de asistencia · TDD 2027</h1><p class="note">Consulta local de una exportación de la pestaña Asistencia. Los registros no se publican en el sitio ni se envían a un servidor.</p><section class="panel"><label for="file">Abrir archivo Excel de asistencia (.xlsx)</label><input id="file" type="file" accept=".xlsx,.xls,.csv"><p id="status" role="status">Seleccioná el archivo exportado desde Google Sheets.</p><div class="filters"><div><label for="area">Área</label><select id="area"><option value="">Todas</option></select></div><div><label for="school">Escuela</label><select id="school"><option value="">Todas</option></select></div><div><label for="date">Fecha</label><select id="date"><option value="">Todas</option></select></div><div><label for="commission">Comisión</label><select id="commission"><option value="">Todas</option></select></div><div><label for="meeting">Encuentro</label><select id="meeting"><option value="">Todos</option></select></div><div><label for="region">DE / Región</label><select id="region"><option value="">Todos</option></select></div><div><label for="type">Tipo de formación</label><select id="type"><option value="">Todos</option></select></div><div><label for="query">DNI, nombre, apellido o correo</label><input id="query" placeholder="Buscar docente"></div></div><div class="actions"><button id="reset">Limpiar filtros</button><button id="print" disabled>Imprimir informe</button><button id="export" disabled>Exportar Excel</button></div></section><section class="panel"><p id="count"></p><div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const HEAD=['Fecha','DNI','Nombre','Apellido','Correo','Dep. Fun','DE/Región','Establecimiento','Tipo de Formación','Área','Codigo','Comision','Encuentro'],FIELDS={area:9,school:7,date:0,commission:11,meeting:12,region:6,type:8},$=id=>document.getElementById(id);let rows=[],filtered=[];const clean=v=>String(v??'').trim(),norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();HEAD.forEach(h=>{const th=document.createElement('th');th.textContent=h;$('head').append(th)});function render(){const q=norm($('query').value);filtered=rows.filter(r=>Object.entries(FIELDS).every(([k,i])=>!$(k).value||$(k).value===r[i])&&(!q||[1,2,3,4].some(i=>norm(r[i]).includes(q))));$('count').textContent=filtered.length+' registros · '+new Set(filtered.map(r=>r[1]).filter(Boolean)).size+' DNI únicos';const frag=document.createDocumentFragment();for(const r of filtered){const tr=document.createElement('tr');for(const value of r){const td=document.createElement('td');td.textContent=value;tr.append(td)}frag.append(tr)}$('body').replaceChildren(frag);$('print').disabled=$('export').disabled=!filtered.length}function options(){for(const [k,i] of Object.entries(FIELDS)){const el=$(k),vals=[...new Set(rows.map(r=>r[i]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));el.replaceChildren(new Option('Todos',''));vals.forEach(v=>el.add(new Option(v,v)))}render()}$('file').addEventListener('change',async()=>{const file=$('file').files[0];if(!file)return;if(!window.XLSX){$('status').textContent='No se pudo cargar el lector de Excel.';return}try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const sheet=wb.Sheets[wb.SheetNames.find(n=>norm(n)==='asistencia')||wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false,dateNF:'dd/mm/yyyy'});const indexes=HEAD.map(h=>raw[0].findIndex(v=>norm(v)===norm(h)));if(indexes.some(i=>i<0))throw Error('Faltan columnas requeridas en el archivo.');rows=raw.slice(1).map(r=>indexes.map(i=>clean(r[i]))).filter(r=>r.some(Boolean));$('status').textContent=rows.length+' registros cargados. No se envió ningún dato al servidor.';options()}catch(e){$('status').textContent=e.message}});Object.keys(FIELDS).forEach(k=>$(k).addEventListener('change',render));$('query').addEventListener('input',render);$('reset').addEventListener('click',()=>{Object.keys(FIELDS).forEach(k=>$(k).value='');$('query').value='';render()});$('print').addEventListener('click',()=>window.print());$('export').addEventListener('click',()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HEAD,...filtered]),'Asistencia');XLSX.writeFile(wb,'informe_asistencia_TDD2027.xlsx')});
</script></body></html>
