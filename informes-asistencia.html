<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informes de asistencia | TDD 2027</title><style>body{font:15px system-ui;margin:0;background:#f3f6fa;color:#12395c}header{padding:18px 5%;background:white;border-bottom:1px solid #dce5ed}header img{max-width:250px}main{max-width:1250px;margin:auto;padding:25px 18px}.panel{background:white;border:1px solid #dce5ed;border-radius:13px;padding:18px;margin:16px 0}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b7c8d5;border-radius:7px;background:white}button{background:#12395c;color:white;border:0;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer;margin:5px 6px 5px 0}button:disabled{opacity:.5}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e0e8ed;text-align:left}th{position:sticky;top:0;background:#eaf1f7}@media(max-width:800px){.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.filters{grid-template-columns:1fr}}@media print{header,.filters,.actions,.note{display:none}body{background:white;color:black}main{padding:0;max-width:none}.panel{border:0;padding:0}.scroll{overflow:visible;max-height:none}table{white-space:normal;font-size:9px}th{position:static}@page{size:landscape}}.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{border:1px solid #dce5ed;border-radius:12px;background:#edf3f8;padding:16px}.stat strong{display:block;font-size:29px;color:#12395c}.stat small{color:#526b80}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.group{background:white;border:1px solid #dce5ed;border-radius:12px;padding:14px}.group h3{margin:0 0 10px}.group p{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e8edf1;margin:0;padding:8px 0;color:#12395c;font-size:13px}.group b{white-space:nowrap}</style></head><body><header><img src="assets/em-logo-header.svg" alt="Escuela de Maestros"></header><main><h1>Informes de asistencia · TDD 2027</h1><p class="note">Consulta en vivo de la pestaña Asistencias de Google Sheets, exclusivamente en modo lectura. Si la consulta falla, se mostrará el motivo aquí.</p><section class="panel"><p id="status" role="status">Consultando la pestaña Asistencias…</p><div class="actions"><button id="refresh">Actualizar datos</button><button id="print" disabled>Imprimir informe</button><button id="export" disabled>Exportar Excel</button></div></section><section class="panel"><h2>Filtros de asistencia</h2><div class="filters" id="filters"></div><div class="actions"><button id="clearFilters" type="button">Limpiar filtros</button></div><p id="filterSummary" aria-live="polite"></p></section><section class="panel"><h2>Indicadores de asistencia</h2><div class="dash" id="dash"></div><div class="groups" id="groups"></div></section><section class="panel"><h2><button id="toggleRecords" type="button" aria-expanded="false" aria-controls="recordsContent" style="background:transparent;color:#12395c;padding:0;margin:0;font:inherit;text-align:left">▸ Registros individuales</button></h2><div id="recordsContent" hidden><p id="count"></p><div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const HEAD=['Fecha','DNI','Nombre','Apellido','Correo','Dep. Fun','DE/Región','Establecimiento','Tipo de Formación','Área','Codigo','Comision','Encuentro'],FIELDS={area:9,school:7,date:0,commission:11,meeting:12,region:6,type:8},$=id=>document.getElementById(id);let rows=[],filtered=[];const clean=v=>String(v??'').trim(),norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();HEAD.forEach(h=>{const th=document.createElement('th');th.textContent=h;$('head').append(th)});function render(){filtered=rows.filter(r=>FILTERS.every(f=>!$(f.id).value||r[f.index]===$(f.id).value)&&(!$('searchPeople').value||norm(r.join(' ')).includes(norm($('searchPeople').value))));$('count').textContent=filtered.length+' registros · '+new Set(filtered.map(r=>r[1]).filter(Boolean)).size+' DNI únicos';$('filterSummary').textContent='Mostrando '+filtered.length+' de '+rows.length+' registros';const people=new Set(filtered.map(r=>r[1]).filter(Boolean));const cards=[['Docentes únicos',people.size],['Registros de asistencia',filtered.length],['Áreas',new Set(filtered.map(r=>r[9]).filter(Boolean)).size],['Escuelas',new Set(filtered.map(r=>r[7]).filter(Boolean)).size],['Comisiones',new Set(filtered.map(r=>r[11]).filter(Boolean)).size],['Fechas',new Set(filtered.map(r=>r[0]).filter(Boolean)).size]];$('dash').replaceChildren();for(const [label,value] of cards){const box=document.createElement('div');box.className='stat';const n=document.createElement('strong');n.textContent=value;const t=document.createElement('small');t.textContent=label;box.append(n,t);$('dash').append(box)}$('groups').replaceChildren();for(const [title,index] of [['Por área',9],['Por escuela',7],['Por fecha',0],['Por comisión',11],['Por encuentro',12],['Por DE/Región',6],['Por tipo de formación',8]]){const map=new Map();for(const r of filtered){const k=r[index]||'Sin dato';if(!map.has(k))map.set(k,new Set());if(r[1])map.get(k).add(r[1])}const card=document.createElement('section');card.className='group';const h=document.createElement('h3');h.textContent=title;card.append(h);for(const [name,ids] of [...map.entries()].sort((a,b)=>b[1].size-a[1].size)){const line=document.createElement('p');const span=document.createElement('span');span.textContent=name;const b=document.createElement('b');b.textContent=ids.size+' docentes';line.append(span,b);card.append(line)}$('groups').append(card)}const frag=document.createDocumentFragment();for(const r of filtered){const tr=document.createElement('tr');for(const value of r){const td=document.createElement('td');td.textContent=value;tr.append(td)}frag.append(tr)}$('body').replaceChildren(frag);$('print').disabled=$('export').disabled=!filtered.length}const FILTERS=[{id:'fArea',label:'Área',index:9},{id:'fSchool',label:'Establecimiento',index:7},{id:'fDate',label:'Fecha',index:0},{id:'fCommission',label:'Comisión',index:11},{id:'fMeeting',label:'Encuentro',index:12},{id:'fRegion',label:'DE/Región',index:6},{id:'fType',label:'Tipo de formación',index:8},{id:'fDep',label:'Dependencia funcional',index:5}];for(const f of FILTERS){const wrap=document.createElement('div'),label=document.createElement('label'),sel=document.createElement('select');label.textContent=f.label;label.htmlFor=f.id;sel.id=f.id;sel.addEventListener('change',render);wrap.append(label,sel);$('filters').append(wrap)}const searchWrap=document.createElement('div'),searchLabel=document.createElement('label'),search=document.createElement('input');searchLabel.textContent='Buscar docente, DNI o correo';searchLabel.htmlFor='searchPeople';search.id='searchPeople';search.placeholder='Nombre, apellido, DNI…';search.addEventListener('input',render);searchWrap.append(searchLabel,search);$('filters').append(searchWrap);$('clearFilters').addEventListener('click',()=>{for(const f of FILTERS)$(f.id).value='';search.value='';render()});function options(){for(const f of FILTERS){const sel=$(f.id),previous=sel.value,values=[...new Set(rows.map(r=>r[f.index]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));sel.replaceChildren(new Option('Todos',''),...values.map(v=>new Option(v,v)));if(values.includes(previous))sel.value=previous}render()}const SHEET_ID='1hznlu4j_Ip4KqYNpMrdhvbJvnHrPl0hOIJ6qBOsTRb4';function cellValue(c){if(!c)return '';if(c.f!=null)return clean(c.f);if(c.v==null)return '';if(typeof c.v==='string'&&c.v.startsWith('Date(')){const m=c.v.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return String(m[3]).padStart(2,'0')+'/'+String(Number(m[2])+1).padStart(2,'0')+'/'+m[1]}return clean(c.v)}function load(){const status=$('status');status.textContent='Consultando Google Sheets…';const callback='tdd_assist_'+Math.random().toString(36).slice(2),tag=document.createElement('script');let timer;function cleanup(){clearTimeout(timer);tag.remove();delete window[callback]}function fail(message){cleanup();status.textContent=message}window[callback]=res=>{cleanup();if(res.status==='error'){status.textContent='Google Sheets devolvió un error: '+String(res.errors?.[0]?.detailed_message||res.errors?.[0]?.message||'sin detalles');return}if(!res.table){status.textContent='Google Sheets respondió sin tabla: '+String(res.errors?.[0]?.detailed_message||res.errors?.[0]?.message||'respuesta inesperada');return}const cols=(res.table.cols||[]).map(x=>norm(x.label||x.id));const aliases={'dep. fun':['dep fun','dependencia funcional'],'de/región':['de/region','de region','d.e./region'],'tipo de formación':['tipo de formacion'],'codigo':['código'],'comision':['comisión']};const indexes=HEAD.map((h,i)=>{const opts=[norm(h),...(aliases[norm(h)]||[])];const found=cols.findIndex(v=>opts.includes(v));return found>=0?found:i});if(cols.length<HEAD.length){status.textContent='La hoja respondió, pero solo se encontraron '+cols.length+' columnas. Se esperaban 13.';return}rows=(res.table.rows||[]).map(r=>indexes.map(i=>cellValue((r.c||[])[i]))).filter(r=>r.some(Boolean));options();status.textContent='Datos actualizados: '+rows.length+' registros. Consulta de solo lectura.'};tag.onerror=()=>fail('No se pudo leer la pestaña Asistencias desde este sitio. Puede requerir permisos de Google Sheets; no es un problema de subir archivos.');timer=setTimeout(()=>fail('La consulta tardó demasiado. Probá actualizar.'),25000);tag.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?'+new URLSearchParams({gid:'87091997',range:'A:M',headers:'1',tqx:'out:json;responseHandler:'+callback,_:String(Date.now())});document.head.append(tag)}$('toggleRecords').addEventListener('click',()=>{const panel=$('recordsContent'),open=panel.hidden;panel.hidden=!open;$('toggleRecords').setAttribute('aria-expanded',String(open));$('toggleRecords').textContent=(open?'▾ ':'▸ ')+'Registros individuales'});$('refresh').addEventListener('click',load);load();$('print').addEventListener('click',()=>window.print());$('export').addEventListener('click',()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HEAD,...filtered]),'Asistencia');XLSX.writeFile(wb,'informe_asistencia_TDD2027.xlsx')});
</script></body></html>
