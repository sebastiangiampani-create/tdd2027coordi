<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR de asistencia | TDD 2027</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#12395c;font:16px system-ui,Arial}header{background:white;padding:16px 5%;border-bottom:1px solid #d8e1e8}header img{max-width:280px;width:65vw}h1{margin:0 0 8px}main{max-width:1100px;margin:auto;padding:26px 18px}.filters,.item{background:white;border:1px solid #d8e1e8;border-radius:14px;padding:20px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.filters label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}select{width:100%;padding:12px;border:1px solid #afc3d1;border-radius:8px;background:white;font:inherit}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.item h2{font-size:19px}.qr{width:100%;max-height:330px;object-fit:contain}.details{color:#526b80;font-size:14px;line-height:1.6}.btn{display:inline-block;background:#12395c;color:white;padding:12px 14px;border-radius:8px;text-decoration:none;font-weight:700;margin:7px 7px 0 0}.secondary{background:#e9f1f7;color:#12395c}footer{background:#0d3550;margin-top:40px;padding:25px 5%;display:flex;justify-content:space-between;gap:20px}footer img{max-width:44%;max-height:52px}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style></head><body><header><img src="assets/em-logo-header.svg" alt="Escuela de Maestros"></header><main><h1>QR de asistencia · TDD 2027</h1><p>Seleccioná área curricular, fecha y sede para encontrar el código de asistencia correspondiente.</p><section class="filters"><div><label for="area">Área curricular</label><select id="area"><option value="">Todas las áreas</option></select></div><div><label for="date">Fecha del encuentro</label><select id="date"><option value="">Todas las fechas</option></select></div><div><label for="venue">Sede</label><select id="venue"><option value="">Todas las sedes</option></select></div></section><p id="status" role="status">Cargando datos de asistencia…</p><div class="results" id="results"></div></main><footer><img src="assets/em-logo-footer.svg" alt="Escuela de Maestros"><img src="assets/ministerio-footer.svg" alt="Ministerio de Educación"></footer><script>
const ID='1hznlu4j_Ip4KqYNpMrdhvbJvnHrPl0hOIJ6qBOsTRb4';const $=id=>document.getElementById(id);let rows=[];const unique=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es'));function sheet(name){return new Promise((ok,bad)=>{const cb='qr_cb_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>{clean();bad(Error('No se pudo leer la planilla de asistencia.'))},18000);function clean(){clearTimeout(timer);script.remove();delete window[cb]}window[cb]=res=>{clean();if(res.status==='error')return bad(Error('La planilla no está disponible para lectura pública.'));ok(res.table.rows.map(r=>r.c.map(c=>c?.f??c?.v??'')))};script.onerror=()=>{clean();bad(Error('Error de conexión con Google Sheets.'))};script.src='https://docs.google.com/spreadsheets/d/'+ID+'/gviz/tq?'+new URLSearchParams({sheet:name,headers:'1',tqx:'out:json;responseHandler:'+cb});document.head.append(script)})}function dateKey(s){const m=String(s).match(/(\d{2})\/(\d{2})/);return m?m[2]+'-'+m[1]:''}function getDates(r){return r.dates.map(dateKey).filter(Boolean)}function optionList(el,values,label,old){el.replaceChildren(new Option(label,''));values.forEach(v=>el.add(new Option(v,v)));if(values.includes(old))el.value=old}function filters(changed){const a=$('area').value,d=$('date').value,v=$('venue').value;if(changed!=='date'){const dates=unique(rows.filter(r=>(!a||r.area===a)&&(!v||r.venue===v)).flatMap(getDates));optionList($('date'),dates,'Todas las fechas',d)}const actual=$('date').value;const venues=unique(rows.filter(r=>(!a||r.area===a)&&(!actual||getDates(r).includes(actual))).map(r=>r.venue));optionList($('venue'),venues,'Todas las sedes',v)}function render(){const a=$('area').value,d=$('date').value,v=$('venue').value;const result=rows.filter(r=>(!a||r.area===a)&&(!d||getDates(r).includes(d))&&(!v||r.venue===v));$('status').textContent=result.length+' resultado(s) de '+rows.length+' códigos disponibles';const root=$('results');root.replaceChildren();if(!result.length){root.textContent='No se encontraron códigos para esos filtros.';return}for(const r of result){const box=document.createElement('article');box.className='item';const h=document.createElement('h2');h.textContent=r.commission;const p=document.createElement('p');p.className='details';p.textContent=r.area+' · '+r.venue+' · '+r.hours+' · '+r.code+' · '+r.dates.join(' / ');box.append(h,p);if(r.drive){const img=document.createElement('img');img.className='qr';img.alt='QR '+r.code;img.loading='lazy';img.src='https://drive.google.com/thumbnail?id='+encodeURIComponent(r.drive)+'&sz=w800';box.append(img);const dl=document.createElement('a');dl.className='btn';dl.href='https://drive.google.com/uc?export=download&id='+encodeURIComponent(r.drive);dl.target='_blank';dl.rel='noopener';dl.textContent='Descargar QR';box.append(dl)}if(r.form){const link=document.createElement('a');link.className='btn secondary';link.href=r.form;link.target='_blank';link.rel='noopener';link.textContent='Abrir asistencia';box.append(link)}root.append(box)}}Promise.all([sheet('Propuestas'),sheet('QR')]).then(([p,q])=>{const drives=new Map(q.map(r=>[String(r[0]).trim(),String(r[2]||'').trim()]));rows=p.filter(r=>/^C0890-\d+/.test(String(r[0]))).map(r=>({code:String(r[0]).trim(),commission:String(r[1]||''),hours:String(r[5]||''),area:String(r[6]||''),venue:String(r[7]||''),dates:[r[9],r[10],r[11],r[12]].filter(Boolean).map(String),form:String(r[13]||''),drive:drives.get(String(r[0]).trim())||''}));optionList($('area'),unique(rows.map(r=>r.area)),'Todas las áreas','');filters('area');render()}).catch(e=>{$('status').textContent=e.message});for(const name of ['area','date','venue'])$(name).addEventListener('change',()=>{filters(name);render()});
</script></body></html>
