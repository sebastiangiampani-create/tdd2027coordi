:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#153243;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.brand{background:#fff;display:flex;justify-content:center;padding:17px}.brand svg{width:min(340px,88vw);height:auto}header{background:#12395c;color:white;padding:27px 20px 38px}header .wrap{max-width:1100px;margin:auto}header h1{margin:4px 0 7px;font-size:clamp(28px,5vw,40px)}header p{margin:0;color:#d8e6f2}.wrap{max-width:1100px;margin:auto;padding:0 17px}.content{margin-top:-19px}.step{background:white;border:1px solid #dce5ec;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #1532430a}.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.stephead h2{font-size:19px;margin:0}.stephead span{font-size:12px;color:#597181;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}.tile{appearance:none;text-align:left;background:#f5f8fb;border:2px solid transparent;border-radius:14px;padding:16px;min-height:92px;cursor:pointer;color:inherit;font:inherit;transition:background .15s,border-color .15s}.tile strong{display:block;font-size:17px;overflow-wrap:anywhere}.tile small{display:block;margin-top:9px;color:#557081;font-size:13px}.tile.selected{border-color:#087f78;background:#e5f6f3}.tile:focus-visible,.back:focus-visible{outline:3px solid #007e8a;outline-offset:3px}.tile:active{transform:scale(.99)}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.days .tile{text-align:center;min-height:92px;padding:13px 7px}.days .tile strong{font-size:16px}.turns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.turns .tile{text-align:center}.back{border:0;background:none;color:#126e65;font-weight:750;cursor:pointer;font-size:14px;padding:8px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px}.metric{background:#e8f0f6;border-radius:13px;padding:14px}.metric strong{font-size:26px;display:block}.metric small{color:#506a7a}.result{border:1px solid #dce5ec;border-radius:13px;padding:15px;margin:9px 0;background:#fff}.result h3{margin:0 0 8px;font-size:17px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#e6f6f3;border-radius:20px;padding:5px 10px;font-size:12px;color:#087269;font-weight:700}.result p{margin:10px 0 0;color:#516979;white-space:pre-line}.muted{color:#5b7180}.hint{padding:15px;background:#f5f8fb;border-radius:12px;color:#526a7c}.hidden{display:none!important}#status{font-size:13px;color:#607887;margin:15px 0 24px}footer{text-align:center;padding:25px;background:#12395c;color:white;margin-top:35px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.days{grid-template-columns:repeat(3,minmax(0,1fr))}.turns{grid-template-columns:repeat(2,minmax(0,1fr))}.step{padding:15px}.tile{padding:13px;min-height:88px}.tile strong{font-size:15px}.metrics{gap:7px}.metric{padding:10px}.metric strong{font-size:21px}} .dayboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.daypanel{background:#f6f9fc;border:1px solid #dce5ec;border-radius:14px;padding:13px}.daypanel h3{margin:0 0 9px;font-size:16px}.daypanel .tile{width:100%;min-height:65px;margin:4px 0;padding:11px}.commissionboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.commissionboard .tile{min-height:72px}.schoollist{padding:0 0 0 20px;margin:8px 0}.schoollist li{padding:4px 0}.selectedcontext{font-size:14px;color:#5b7180;margin-bottom:12px} @media(max-width:600px){.dayboard{grid-template-columns:1fr}.commissionboard{grid-template-columns:repeat(2,minmax(0,1fr))}}

html{background:#f4f7fa}body{background:#f4f7fa!important;min-height:100vh;display:flex;flex-direction:column;font-family:Archivo,system-ui,sans-serif!important}main{flex:1 0 auto}body>.brand,header .brand{display:none!important}body>header:not(.em-site-top){background:#edf3f8!important;color:#12395c!important;border-bottom:1px solid #d8e1e8;padding-top:25px;padding-bottom:30px}body>header:not(.em-site-top) h1{color:#12395c!important;font-weight:900;letter-spacing:-.035em}body>header:not(.em-site-top) p{color:#526b80!important}body>header:not(.em-site-top) a{color:#175a82!important}body>header:not(.em-site-top) .tag,body>header:not(.em-site-top) .eyebrow{color:#2c5da6!important}body>header:not(.em-site-top) .edition{color:#12395c!important;border-color:#aabdc9!important}body>header:not(.em-site-top) .lead{color:#526b80!important}.em-site-top{flex-shrink:0}.em-site-footer{flex-shrink:0}body>.foot,body>footer:not(.em-site-footer),main>footer:not(.em-site-footer){display:none!important}body .panel,body .step,body .search-panel,body .subject-panel{background:#fff;border-color:#d8e1e8;box-shadow:0 9px 28px rgba(18,57,92,.06)}body .card,body .tile{background:#fff;border:1px solid #d8e1e8;box-shadow:0 5px 18px rgba(18,57,92,.05);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}body .card:hover,body .tile:hover{border-color:#8aafc6;box-shadow:0 9px 24px rgba(18,57,92,.12);transform:translateY(-2px)}body .tile.active,body .card.active{background:#e7f8f5;border-color:#168d83}body button,body select,body input{font-family:Archivo,system-ui,sans-serif}body button:focus-visible,body a:focus-visible{outline:3px solid #2c5da6;outline-offset:3px}.em-site-top{box-shadow:0 2px 12px rgba(18,57,92,.045)}

</style></head><body><div class="em-site-top"><a href="portal.html" aria-label="Ir al Portal TDD 2027"><img src="assets/em-logo-header.svg" alt="Escuela de Maestros"></a><span class="em-edition">TDD 2027</span></div><header><div class="wrap"><div style="font-size:12px;letter-spacing:1px;font-weight:800;color:#bce7df">ESCUELA DE MAESTROS · TDD 2027</div><h1>Tablero de sedes</h1><p>Elegí una sede para ver los días y turnos. Abrí una comisión para consultar sus escuelas.</p></div></header><main class="wrap content"><section class="step"><div class="stephead"><h2>1. Elegí una sede</h2><span id="venueCount"></span></div><div id="venues" class="grid"></div></section><section class="step hidden" id="daySection"><div class="stephead"><h2>2. Días y turnos</h2><button class="back" id="changeVenue" type="button">Cambiar sede</button></div><div id="days" class="dayboard"></div></section><section class="step hidden" id="shiftSection"><div class="stephead"><h2>3. Comisiones</h2><button class="back" id="changeDay" type="button">Cambiar día</button></div><div id="turns" class="commissionboard"></div></section><section class="step hidden" id="details"><div class="stephead"><h2 id="detailTitle">Escuelas</h2><span id="selection"></span></div><div id="metrics" class="metrics"></div><div id="entries"></div></section><p id="status" role="status">Cargando datos…</p></main><footer>Escuela de Maestros · TDD 2027</footer><script>
'use strict';const SHEET='1x-cRhsulmABI8wyB87xKeZw4Kq1GIMb4XCEzfaYozww',CACHE='tdd2027-bedeles-cache-v1',keys=['commission','schools','area','shift','day','hours','venue'];function isDataRow(r){const n=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const c=n(r.commission),a=n(r.area),t=n(r.shift),d=n(r.day),h=n(r.hours),v=n(r.venue);if(!c||['comision','comisiones','nro comision','numero de comision','n° comision'].includes(c))return false;if(['area','areas','area curricular'].includes(a)||['turno','turnos'].includes(t)||['dia','dias'].includes(d)||['horario','horarios'].includes(h)||['sede','sedes'].includes(v))return false;return true}

const $=id=>document.getElementById(id),clean=v=>String(v??'').replace(/\s+/g,' ').trim(),norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),weekdays=['lunes','martes','miercoles','jueves','viernes'];let rows=[],busy=false,last=0;

function unique(v){return [...new Set(v.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}))}
function restore(){try{const o=JSON.parse(localStorage.getItem(CACHE)||'null');if(o?.rows?.length){rows=o.rows.filter(isDataRow);last=o.date||0;return true}}catch(e){}return false}
function save(){try{localStorage.setItem(CACHE,JSON.stringify({rows,date:Date.now()}))}catch(e){}}
function jsonp(offset){return new Promise((resolve,reject)=>{const name='__tddbed_'+offset+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let ended=false;const finish=(error,data)=>{if(ended)return;ended=true;clearTimeout(timer);delete window[name];script.remove();error?reject(error):resolve(data)};window[name]=data=>data.status==='error'?finish(Error('Google Sheets rechazó la consulta')):finish(null,data.table);const q=encodeURIComponent('select A,B,C,D,E,F,G limit 400 offset '+offset);script.src='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tq='+q+'&tqx='+encodeURIComponent('responseHandler:'+name);script.onerror=()=>finish(Error('No se pudo conectar'));const timer=setTimeout(()=>finish(Error('La consulta tardó demasiado')),12000);document.head.append(script)})}
async function refresh(){if(busy)return;busy=true;$('status').textContent='Sincronizando automáticamente…';try{const all=[];for(let i=0;i<100;i++){const t=await jsonp(i*400);const batch=(t.rows||[]).map(r=>{const o={};keys.forEach((k,j)=>o[k]=clean(r.c?.[j]?.f??r.c?.[j]?.v));return o}).filter(isDataRow);all.push(...batch);if((t.rows||[]).length<400)break}if(!all.length)throw Error('La planilla no devolvió datos');rows=all;last=Date.now();save();render();$('status').textContent='Agenda actualizada · '+rows.length+' registros'}catch(e){$('status').textContent=(rows.length?'Se mantienen los datos guardados. ':'')+e.message}finally{busy=false}}

let selectedVenue='',selectedDay='',selectedShift='';const dayNames=['Lunes','Martes','Miércoles','Jueves','Viernes'];function dayOf(r){return weekdays.find(d=>norm(r.day).includes(d))||''}function commissionCount(a){return new Set(a.map(r=>norm(r.commission)+'|'+norm(r.shift)+'|'+norm(r.hours))).size}function counts(a){return commissionCount(a)+' comisiones · '+new Set(a.map(r=>r.area)).size+' áreas'}function tile(title,subtitle,selected,fn){const b=document.createElement('button');b.type='button';b.className='tile'+(selected?' selected':'');b.setAttribute('aria-pressed',selected?'true':'false');const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('small');small.textContent=subtitle;b.append(strong,small);b.addEventListener('click',fn);return b}function metric(n,label){const e=document.createElement('div');e.className='metric';const a=document.createElement('strong');a.textContent=n;const b=document.createElement('small');b.textContent=label;e.append(a,b);return e}
function render(){const venues=$('venues');venues.replaceChildren();const names=unique(rows.map(r=>r.venue));$('venueCount').textContent=names.length+' sedes';for(const v of names){const data=rows.filter(r=>r.venue===v);venues.append(tile(v,commissionCount(data)+' comisiones',selectedVenue===v,()=>{selectedVenue=v;selectedDay='';selectedShift='';render();$('daySection').scrollIntoView({behavior:'smooth',block:'start'})}))}if(!names.length){const p=document.createElement('p');p.className='hint';p.textContent='Sin sedes disponibles. Se cargarán automáticamente cuando haya conexión.';venues.append(p)}$('daySection').classList.toggle('hidden',!selectedVenue);$('shiftSection').classList.toggle('hidden',!selectedShift);$('details').classList.add('hidden');if(!selectedVenue)return;const byVenue=rows.filter(r=>r.venue===selectedVenue),days=$('days');days.replaceChildren();for(let i=0;i<weekdays.length;i++){const d=weekdays[i],byDay=byVenue.filter(r=>dayOf(r)===d);const panel=document.createElement('div');panel.className='daypanel';const title=document.createElement('h3');title.textContent=dayNames[i];panel.append(title);if(!byDay.length){const note=document.createElement('div');note.className='muted';note.textContent='Sin actividad';panel.append(note)}else{for(const t of unique(byDay.map(r=>r.shift))){const subset=byDay.filter(r=>r.shift===t);panel.append(tile(t,commissionCount(subset)+' comisiones',selectedDay===d&&selectedShift===t,()=>{selectedDay=d;selectedShift=t;render();$('shiftSection').scrollIntoView({behavior:'smooth',block:'start'})}))}}days.append(panel)}if(!selectedShift)return;const found=byVenue.filter(r=>dayOf(r)===selectedDay&&r.shift===selectedShift);const turns=$('turns');turns.replaceChildren();const context=document.createElement('p');context.className='selectedcontext';context.textContent=selectedVenue+' · '+dayNames[weekdays.indexOf(selectedDay)]+' · '+selectedShift;turns.append(context);const groups=new Map();for(const r of found){const key=[r.commission,r.area,r.hours].map(norm).join('|');if(!groups.has(key))groups.set(key,{...r,schools:new Set()});if(r.schools)groups.get(key).schools.add(r.schools)}for(const [key,g] of [...groups.entries()].sort((a,b)=>a[1].hours.localeCompare(b[1].hours,'es')||a[1].commission.localeCompare(b[1].commission,'es',{numeric:true}))){turns.append(tile('Comisión '+g.commission,[g.area,g.hours].filter(Boolean).join(' · '),false,()=>showSchools(g)))}}
function showSchools(g){$('details').classList.remove('hidden');$('detailTitle').textContent='Comisión '+g.commission;$('selection').textContent=[g.area,g.hours].filter(Boolean).join(' · ');const metrics=$('metrics');metrics.replaceChildren();metrics.classList.add('hidden');const entries=$('entries');entries.replaceChildren();const title=document.createElement('p');title.className='selectedcontext';title.textContent=selectedVenue+' · '+dayNames[weekdays.indexOf(selectedDay)]+' · '+selectedShift;entries.append(title);const list=document.createElement('ul');list.className='schoollist';const schools=unique([...g.schools].flatMap(s=>s.split(/[;\\n]/).map(clean).filter(Boolean)));for(const s of schools){const li=document.createElement('li');li.textContent=s;list.append(li)}if(!schools.length){const li=document.createElement('li');li.textContent='No hay escuelas informadas';list.append(li)}entries.append(list);$('details').scrollIntoView({behavior:'smooth',block:'start'})}
$('changeVenue').addEventListener('click',()=>{selectedVenue='';selectedDay='';selectedShift='';render();$('venues').scrollIntoView({behavior:'smooth'})});$('changeDay').addEventListener('click',()=>{selectedDay='';selectedShift='';render();$('days').scrollIntoView({behavior:'smooth'})});
const cached=restore();if(cached){render();$('status').textContent='Datos guardados disponibles sin conexión'}else render();if(navigator.onLine)refresh();else if(!cached)$('status').textContent='Se necesita internet para la primera carga';window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine&&Date.now()-last>60000)refresh()});
</script><footer class="em-site-footer" aria-label="Identidad institucional"><img class="em-logo" src="assets/em-logo-footer.svg" alt="Escuela de Maestros"><img class="em-ministerio" src="assets/ministerio-footer.svg" alt="Ministerio de Educación · Buenos Aires Ciudad"></footer></body></html>
